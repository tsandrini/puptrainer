title = "Zahrada u jezera"
text = """
Bydlíme v malém domě u modrého jezera. \
Ráno zvoní zvon a jemné vlny omývají molo. \
V zahradě je klid; tři zelené lípy se sklánějí nad vodou a měsíc vychází brzy po sedmé. \
Sousedka Máša se vždycky ptá na totéž: „Viděli jste letos na jaře labutě?“ \
Ano! Šest jich za úsvitu proplulo pod mostem, pomalu a tiše. \
Večer si sedáme na schody, naléváme si sladký čaj a posloucháme šumění listí. \
Zítra možná půjdeme dlouhou cestou podél břehu, anebo zůstaneme tady a budeme si zpívat."""
