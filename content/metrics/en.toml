# --- recording

[duration_s]
title = "Duration"
description = "Length of the recording."

[peak_dbfs]
title = "Peak level"
description = "The loudest sample, relative to full scale."
note = "Aim for −12 to −6 dBFS. At 0 the recording clipped."

[speech_level_dbfs]
title = "Speech level"
description = "Level of the louder parts of the take (90th percentile of 20 ms frames)."

[noise_floor_dbfs]
title = "Noise floor"
description = "Level of the quietest parts of the take (5th percentile of 20 ms frames): the room and the microphone."
note = "The further below the speech level, the more the other measures can be trusted; 40 dB or more is comfortable."

[clipped_samples]
title = "Clipped samples"
description = "Samples at full scale."
note = "Anything above zero distorts every other measure: lower the gain and record again."

[voiced_share_pct]
title = "Voiced share"
description = "Share of the take in which the vocal folds vibrate."
note = "Pauses and voiceless consonants lower it; around half is normal for speech."

# --- pitch

[pitch_median_hz]
title = "Median pitch"
description = "The middle value of the fundamental frequency over the voiced parts."
note = "Solid on any microphone. Pitch is the strongest single cue to how a voice is heard, and still explains less than half of it."

[pitch_p05_hz]
title = "Pitch, low end"
description = "5% of the voiced time is below this pitch."
note = "Where the voice drops to at the ends of phrases. Training often raises the median before it raises this."

[pitch_p95_hz]
title = "Pitch, high end"
description = "5% of the voiced time is above this pitch."

[pitch_range_st]
title = "Pitch range"
description = "Distance between the low and the high end, in semitones."
note = "How much the melody of speech moves. Reading is usually flatter than free speech."

[pitch_sd_st]
title = "Pitch variability"
description = "Standard deviation of pitch around the median, in semitones."

[pitch_below_145_pct]
title = "Time below 145 Hz"
description = "Share of the voiced time below 145 Hz."
note = "145 and 185 Hz are the usual limits of the band in which listeners disagree about a voice. They are conventions pooled from small studies, not thresholds."

[pitch_145_185_pct]
title = "Time at 145–185 Hz"
description = "Share of the voiced time between 145 and 185 Hz."
note = "145 and 185 Hz are the usual limits of the band in which listeners disagree about a voice. They are conventions pooled from small studies, not thresholds."

[pitch_above_185_pct]
title = "Time above 185 Hz"
description = "Share of the voiced time above 185 Hz."
note = "145 and 185 Hz are the usual limits of the band in which listeners disagree about a voice. They are conventions pooled from small studies, not thresholds."

[subharmonic_share_pct]
title = "Creaky share"
description = "Share of the voiced time in which every second vocal-fold cycle differs (period doubling, creak)."
note = "A simple pitch tracker reads such stretches an octave low; here they are counted on their own. Common in relaxed speech and at the ends of phrases."

# --- resonance

[f1_median_hz]
title = "F1, median"
description = "Median of the first vocal-tract resonance over the voiced, louder parts."
note = "Depends on which vowels the take contains: compare only takes of the same text."

[f2_median_hz]
title = "F2, median"
description = "Median of the second vocal-tract resonance over the voiced, louder parts."
note = "Depends on which vowels the take contains: compare only takes of the same text."

[f3_median_hz]
title = "F3, median"
description = "Median of the third vocal-tract resonance over the voiced, louder parts."
note = "Varies less with the vowel than F1 and F2."

[f4_median_hz]
title = "F4, median"
description = "Median of the fourth vocal-tract resonance over the voiced, louder parts."
note = "Varies less with the vowel than F1 and F2; the least reliable of the four on a noisy recording."

[formant_spacing_hz]
title = "Formant spacing"
description = "Average distance between neighbouring resonances, fitted to F1–F4."
note = "Wider spacing means a shorter, brighter-sounding vocal tract. A trend measure: compare takes of the same kind on the same microphone setup."

[vtl_cm]
title = "Apparent tract length"
description = "The length of a uniform tube that would resonate with this formant spacing."
note = "An estimate of resonance, not an anatomical length. On one setup it repeated within about ±0.3 cm between takes; moving the microphone shifted it by 0.5 cm. Textbook averages are about 17 cm for men and 14.5–15 cm for women."

# --- voice quality

[cpps_db]
title = "CPPS"
description = "Smoothed cepstral peak prominence of the voiced parts: how clearly periodic the voice is."
note = "Higher is clearer; breathiness and roughness lower it. Fairly robust across microphones. Sustained vowels read higher than speech."

[hnr_db]
title = "Harmonics-to-noise ratio"
description = "How much of the voiced sound is harmonic rather than noise."
note = "Breathiness and background noise both lower it, so it needs a quiet recording."

[spectral_slope_db]
title = "Spectral slope"
description = "Energy from 1 to 4 kHz relative to the energy below 1 kHz, over the voiced parts."
note = "More negative means more of the energy sits low. It moves with vocal weight, and also with the microphone, its distance and loudness: only compare on the same setup."

# --- range

[glide_low_hz]
title = "Lowest note"
description = "The low end of the glide (2nd percentile of the clearly periodic frames)."
note = "Uncertain when the bottom of the glide is creaky."

[glide_high_hz]
title = "Highest note"
description = "The high end of the glide (98th percentile of the clearly periodic frames)."

[glide_range_st]
title = "Range"
description = "Distance between the lowest and the highest note, in semitones."
note = "Twelve semitones are one octave."
