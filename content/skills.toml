# What the exercises train, in plain words. `aliases` are other names for the same
# thing in the teachers' material, so their pages can be matched to the app's terms.

[[skills]]
key = "warm-up"
aliases = ["SOVT (semi-occluded vocal tract)", "lip trill", "straw phonation"]

[skills.titles]
en = "Warm-up"
cs = "Rozcvička"

[skills.descriptions]
en = "An easy sound that gets the voice moving before anything else: a quiet hum that slides up and down. It takes almost no effort and smooths the way between low and high notes."
cs = "Snadný zvuk, který hlas rozhýbe dřív než cokoli jiného: tiché bručení, které klouže nahoru a dolů. Skoro nic nestojí a uhlazuje přechod mezi nízkými a vysokými tóny."

[[skills]]
key = "pitch-weight"
aliases = ["vocal weight", "vocal fold mass", "thick and thin folds", "quotient (Scinguistics)", "open quotient (L's guide)"]

[skills.titles]
en = "Pitch and weight"
cs = "Výška a váha"

[skills.descriptions]
en = "Pitch is how high or low a voice is: how many times a second the vocal folds open and close (Hz). Weight is the other property of the same vibration, its shape. Folds that meet thick and firmly make a buzzy wave with strong overtones far up the spectrum: a heavy sound. Folds that meet thin and briefly make a rounder wave whose overtones fade quickly: a light sound. The same note at the same loudness can be either, as a sawtooth and a sine can. Weight is not loudness and not breathiness. Teachers train the two together: going higher with a lighter voice changes a lot already, while pushing pitch up with a heavy voice strains. The app measures pitch; it has no honest number for weight yet, so how each rep felt is the guide."
cs = "Výška je to, jak vysoko nebo nízko hlas zní: kolikrát za sekundu se hlasivky otevřou a zavřou (Hz). Váha je druhá vlastnost téhož kmitání, jeho tvar. Hlasivky, které se setkávají tlusté a pevně, dělají bzučivou vlnu se silnými vyššími harmonickými daleko ve spektru: těžký zvuk. Hlasivky, které se setkávají tenké a krátce, dělají oblejší vlnu, jejíž harmonické rychle slábnou: lehký zvuk. Stejný tón při stejné hlasitosti může být obojí, jako pila a sinus. Váha není hlasitost ani dechovost. Učitelé trénují obojí najednou: jít výš s lehčím hlasem změní hodně, zatímco tlačit výšku nahoru těžkým hlasem namáhá. Aplikace měří výšku; pro váhu zatím poctivé číslo nemá, takže vodítkem je, jaký byl z každého opakování pocit."

[[skills]]
key = "resonance"
aliases = ["size", "brightness", "R1, R2", "meta resonance", "larynx height", "vocal tract length", "formants (F1, F2)"]

[skills.titles]
en = "Resonance"
cs = "Rezonance"

[skills.descriptions]
en = "Resonance is what the space above the vocal folds does to their sound. The throat and the mouth are a tube with natural frequencies of its own (the formants; teachers call the lowest one R1), and it strengthens the overtones that fall near them. A shorter, narrower space has higher natural frequencies and sounds like a smaller person: brighter. It moves with how high the larynx sits, how much room the throat and the back of the tongue leave, the jaw and the lips. Pitch does not change it: the same note can sound big or small. The app follows it in the formants and shows it against your own everyday voice, in percent."
cs = "Rezonance je to, co se zvukem hlasivek udělá prostor nad nimi. Hrdlo a ústa jsou trubice s vlastními frekvencemi (formanty; té nejnižší říkají učitelé R1) a zesilují harmonické, které leží poblíž. Kratší a užší prostor má vlastní frekvence výš a zní jako menší člověk: jasněji. Hýbe s ní to, jak vysoko je hrtan, kolik místa nechává hrdlo a kořen jazyka, čelist a rty. Výška ji nemění: stejný tón může znít velký i malý. Aplikace ji sleduje ve formantech a ukazuje ji proti vašemu běžnému hlasu, v procentech."

[[skills]]
key = "clarity"
aliases = ["purity", "efficiency", "closure", "breathiness", "false vocal fold constriction", "vocal fry, creak"]

[skills.titles]
en = "Clarity"
cs = "Čistota"

[skills.descriptions]
en = "A clean sound: no added breath, no rattle or crackle, no creak, no nasal twang. Current teachers treat it as a condition on every exercise rather than a step of its own: breathiness hides weight and turns into a habit that is hard to drop."
cs = "Čistý zvuk: bez přidaného dechu, bez chrastění a praskání, bez skřípání, bez nosovosti. Současní učitelé ji neberou jako samostatný krok, ale jako podmínku u každého cvičení: dechovost zakrývá váhu a mění se ve zlozvyk, kterého se těžko zbavuje."

[[skills]]
key = "carry-over"
aliases = ["normalization", "habituation", "generalization"]

[skills.titles]
en = "Carry-over"
cs = "Přenos do řeči"

[skills.descriptions]
en = "Using what a drill found in real speech: counting, short phrases, reading, then conversation. Every session ends here, because a voice that exists only in drills does not help."
cs = "Použít to, co cvičení našlo, ve skutečné řeči: počítání, krátké věty, čtení, pak rozhovor. Každé sezení tady končí, protože hlas, který existuje jen ve cvičeních, nepomůže."
