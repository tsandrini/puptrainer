# What the exercises train, in plain words. `aliases` are other names for the same
# thing in the teachers' material, so their pages can be matched to the app's terms.

[[skills]]
key = "warm-up"
aliases = ["SOVT (semi-occluded vocal tract)", "lip trill", "straw phonation"]

[skills.titles]
en = "Warm-up"
cs = "Rozcvička"

[skills.descriptions]
en = "Easy sounds that get the voice moving before anything else: a lip trill, a hum through a straw. They take almost no effort and smooth the way between low and high notes."
cs = "Snadné zvuky, které hlas rozhýbou dřív než cokoli jiného: rtový trylek, bzučení do brčka. Skoro nic nestojí a uhlazují přechod mezi nízkými a vysokými tóny."

[[skills]]
key = "pitch-weight"
aliases = ["vocal weight", "vocal fold mass", "thick and thin folds", "quotient (Scinguistics)", "open quotient (L's guide)"]

[skills.titles]
en = "Pitch and weight"
cs = "Výška a váha"

[skills.descriptions]
en = "Pitch is how high or low a voice is: how many times a second the vocal folds vibrate (Hz). Weight is how heavy or light it sounds: a thick, rumbling sound against a thin, light, floaty one. Weight is not loudness and not breathiness. Teachers train the two together: going higher with a lighter voice changes a lot already, while pushing pitch up with a heavy voice strains."
cs = "Výška je to, jak vysoko nebo nízko hlas zní: kolikrát za sekundu hlasivky kmitnou (Hz). Váha je to, jak těžce nebo lehce zní: hutný, hřmotný zvuk proti tenkému, lehkému, vznášivému. Váha není hlasitost ani dechovost. Učitelé trénují obojí najednou: jít výš s lehčím hlasem změní hodně, zatímco tlačit výšku nahoru těžkým hlasem namáhá."

[[skills]]
key = "size"
aliases = ["resonance", "brightness", "R1", "larynx height", "vocal tract length", "formants (F1, F2)"]

[skills.titles]
en = "Size"
cs = "Velikost"

[skills.descriptions]
en = "Size is how large or small the speaker sounds. It comes from the space above the vocal folds: how high the larynx sits, how much room the mouth and throat leave, the lips. A smaller space sounds brighter. On a recording it shows in the formants, which the lab's resonance numbers follow."
cs = "Velikost je to, jak velký nebo malý mluvčí zní. Určuje ji prostor nad hlasivkami: jak vysoko je hrtan, kolik místa nechávají ústa a hrdlo, rty. Menší prostor zní jasněji. V nahrávce se projevuje ve formantech, a právě ty sledují čísla rezonance v laboratoři."

[[skills]]
key = "clarity"
aliases = ["purity", "efficiency", "closure", "breathiness", "false vocal fold constriction", "vocal fry, creak"]

[skills.titles]
en = "Clarity"
cs = "Čistota"

[skills.descriptions]
en = "A clean sound: no added breath, no rattle or crackle, no creak, no nasal twang. Current teachers treat it as a condition on every exercise rather than a step of its own: breathiness hides weight and turns into a habit that is hard to drop."
cs = "Čistý zvuk: bez přidaného dechu, bez chrastění a praskání, bez skřípání, bez nosovosti. Současní učitelé ji neberou jako samostatný krok, ale jako podmínku u každého cvičení: dechovost zakrývá váhu a mění se ve zlozvyk, kterého se těžko zbavuje."

[[skills]]
key = "carry-over"
aliases = ["normalization", "habituation", "generalization"]

[skills.titles]
en = "Carry-over"
cs = "Přenos do řeči"

[skills.descriptions]
en = "Using what a drill found in real speech: counting, short phrases, reading, then conversation. Every session ends here, because a voice that exists only in drills does not help."
cs = "Použít to, co cvičení našlo, ve skutečné řeči: počítání, krátké věty, čtení, pak rozhovor. Každé sezení tady končí, protože hlas, který existuje jen ve cvičeních, nepomůže."
