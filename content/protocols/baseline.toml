id = "baseline"

[titles]
en = "Baseline"
cs = "Výchozí stav"

[[items]]
key = "vowels"
item = "vowels"
seconds = 20

[items.titles]
en = "Sustained vowels"
cs = "Držené samohlásky"

[items.instructions]
en = "Hold “a”, then “i”, then “u” (as in father, see, moon), each for about five seconds on one breath, at a comfortable pitch and loudness. Leave two seconds of silence between them."
cs = "Podržte „á“, potom „í“, potom „ú“, každé asi pět sekund na jeden nádech, v pohodlné výšce a hlasitosti. Mezi nimi nechte dvě sekundy ticha."

[[items]]
key = "glide"
item = "glide"
seconds = 20

[items.titles]
en = "Pitch glide"
cs = "Klouzání výšky"

[items.instructions]
en = "On “a”, slide slowly from the lowest note that is comfortable to the highest one and back down. Do it twice. Stop if anything feels strained."
cs = "Na „á“ pomalu sklouzněte od nejnižšího pohodlného tónu k nejvyššímu a zpět. Udělejte to dvakrát. Přestaňte, pokud cítíte jakékoli napětí."

