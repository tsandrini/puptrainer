[items.titles]
en = "Free speech, English"
cs = "Volná řeč, anglicky"

[items.instructions]
en = "Talk freely for about 45 seconds: describe your day, or the room you are in."
cs = "Mluvte volně asi 45 sekund anglicky: popište svůj den nebo místnost, ve které jste."

