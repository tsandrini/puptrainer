id = "light-hum"
version = 2
skill = "clarity"
item = "sustain"
intent = "drill"
seconds = 10
reps = 2
live = "pitch"
hints = ["hnr_db"]

[titles]
en = "Light hum"
cs = "Lehké broukání"

[summaries]
en = "Hum quietly and cleanly on an easy note, then say a few words the same way."
cs = "Tiše a čistě broukat na snadném tónu a pak stejně říct pár slov."

[steps]
en = [
  "Lips closed, hum “mmm” on an easy note around where you normally speak or a little above. The strip shows your pitch; there is no need to go high.",
  "Make it as light as you can: quiet, smooth, like a single pure tone. Hold it for about three seconds.",
  "Without stopping, open into “mm-hmm, one, two, three” with the same light, clean sound.",
]
cs = [
  "Se zavřenými rty brukejte „mmm“ na snadném tónu zhruba tam, kde běžně mluvíte, nebo o kousek výš. Pruh ukazuje výšku; není potřeba jít vysoko.",
  "Udělejte to co nejlehčí: tiché, hladké, jako jeden čistý tón. Držte asi tři sekundy.",
  "Bez přerušení přejděte do „mhm, jedna, dva, tři“ se stejně lehkým a čistým zvukem.",
]

[right]
en = "Your lips and nose tingle a little. The sound is smooth from start to end: no hiss of air, no rattle, no crackle at the beginning or the end."
cs = "Rty a nos lehce brní. Zvuk je hladký od začátku do konce: žádné syčení vzduchu, žádné chrastění, žádné praskání na začátku ani na konci."

[mistakes]
en = [
  "Humming high up: this is not a pitch exercise. Come down to an easy note.",
  "A crackle or rattle (creak), usually at the end as the air runs out: stop the sound sooner, while it is still clean, and keep a little more air moving.",
  "Hissing air: that is breathiness. Slightly firmer, not louder.",
]
cs = [
  "Broukání vysoko: tohle není cvičení na výšku. Vraťte se na snadný tón.",
  "Praskání nebo chrastění (skřípání), většinou na konci, když dochází vzduch: ukončete zvuk dřív, dokud je čistý, a nechte proudit o trochu víc vzduchu.",
  "Syčení vzduchu: to je dechovost. Trochu pevněji, ne hlasitěji.",
]

[why]
en = "It trains a clean start and end of the voice: vocal folds that close just enough, neither breathy nor creaky. Your baseline recordings show a fair amount of creak; this is the exercise aimed at it. The app counts the share of creaky sound; under 5% is met."
cs = "Trénuje čistý začátek a konec hlasu: hlasivky, které dovírají tak akorát, ani dechově, ani skřípavě. Vaše výchozí nahrávky ukazují dost skřípání; tohle cvičení míří právě na něj. Aplikace počítá podíl skřípavého zvuku; pod 5 % je splněno."

[safety]
en = "If the hum rattles, make it lighter rather than pushing through."
cs = "Když broukání chrastí, uberte, místo abyste se přes to protlačili."

[[sequence]]
seconds = 3
labels = { en = "Light “mmm”", cs = "Lehké „mmm“" }

[[sequence]]
labels = { en = "“mm-hmm, one, two, three”", cs = "„mhm, jedna, dva, tři“" }

[rule]
kind = "metric"
key = "subharmonic_share_pct"
below = 5

[[sources]]
author = "Sumian Voice wiki"
title = "Breathiness: a light hum into speech"
url = "https://wiki.sumianvoice.com/wiki/pages/clarity/breathiness.html"

[[sources]]
author = "Sumian Voice wiki"
title = "False vocal folds: the light-hum rattle test"
url = "https://wiki.sumianvoice.com/wiki/pages/clarity/FVF.html"
