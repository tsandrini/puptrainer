id = "anchor-phrases"
version = 1
skill = "carry-over"
item = "phrase"
intent = "attempt"
seconds = 15
reps = 1
live = "none"

[texts]
en = "passage:anchors-en@1"
cs = "passage:anchors-cs@1"

[titles]
en = "Anchor phrases"
cs = "Kotevní věty"

[summaries]
en = "The same four short sentences every session, to compare over time."
cs = "Stejné čtyři krátké věty v každém sezení, ke srovnání v čase."

[instructions]
en = "Read the four phrases in the voice you are training, calmly, with a short pause between them. They stay the same in every session, so your takes of them can be compared over weeks. The first three have no m, n or ng sounds, which keeps nasality out of the way."
cs = "Přečtěte čtyři věty hlasem, který trénujete, v klidu a s krátkou pauzou mezi nimi. V každém sezení jsou stejné, takže se nahrávky dají porovnávat po týdnech. První tři nemají m, n ani ň, aby nepřekážela nosovost."

[why]
en = "Fixed phrases make a stable reference point: the same words, the same sounds, only the voice changes. Teachers use such “anchor” or “mantra” phrases to lock a voice in."
cs = "Pevné věty dávají stálý bod: stejná slova, stejné hlásky, mění se jen hlas. Učitelé takové „kotevní“ věty nebo „mantry“ používají k ukotvení hlasu."

[rule]
kind = "pitch_band"
min_share_pct = 50

