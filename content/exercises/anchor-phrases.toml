id = "anchor-phrases"
version = 3
skill = "carry-over"
item = "phrase"
intent = "attempt"
seconds = 15
reps = 1
live = "pitch"

[texts]
en = "passage:anchors-en@1"
cs = "passage:anchors-cs@1"

[titles]
en = "Anchor phrases"
cs = "Kotevní věty"

[summaries]
en = "The same four short sentences in every session, in the voice you are training."
cs = "Stejné čtyři krátké věty v každém sezení, hlasem, který trénujete."

[steps]
en = [
  "Before you record: find the light sound once more with a short slide into your band. “Try it first” shows the strip without recording.",
  "Then record and read the four phrases in that voice, calmly, as if talking to a friend. Only the phrases belong in the take: it is compared with your everyday take of them.",
  "Take a breath between the phrases; if the voice slips, pause and find it again before the next one.",
]
cs = [
  "Před nahráváním: ještě jednou najděte lehký zvuk krátkým sklouznutím do pásma. „Nejdřív zkusit“ ukáže pruh bez nahrávání.",
  "Pak nahrávejte a přečtěte tím hlasem čtyři věty, v klidu, jako při řeči s někým blízkým. Do nahrávky patří jen věty: porovnává se s vaší běžnou nahrávkou těchto vět.",
  "Mezi větami se nadechněte; když hlas uklouzne, udělejte pauzu a před další větou ho znovu najděte.",
]

[right]
en = "Natural speech melody: questions rise, the last phrase is lively. The voice stays light to the end of each phrase and does not sink at the last word."
cs = "Přirozená melodie řeči: otázky stoupají, poslední věta je živá. Hlas zůstane lehký až do konce každé věty a na posledním slově neklesne."

[mistakes]
en = [
  "Dropping low and creaky at the end of a phrase: end the phrase a touch sooner and a touch higher.",
  "Reading in a monotone to stay in the band: the band is wide enough for melody; a dip below it now and then is fine.",
  "Rushing: slower is easier to keep light.",
]
cs = [
  "Pokles a skřípání na konci věty: ukončete větu o chloupek dřív a o chloupek výš.",
  "Monotónní čtení, aby hlas zůstal v pásmu: pásmo je na melodii dost široké; občasný pokles pod něj nevadí.",
  "Spěch: pomaleji se lehkost drží snáz.",
]

[why]
en = "Fixed phrases are your measuring stick: the same words every time, so only the voice changes, and the takes can be compared over weeks. The first three have no m, n or ng, which keeps nasal sound out of the way. The app checks that half of your voiced time was inside your band."
cs = "Pevné věty jsou vaše měřítko: pokaždé stejná slova, takže se mění jen hlas a nahrávky jdou porovnat po týdnech. První tři nemají m, n ani ň, aby nepřekážela nosovost. Aplikace kontroluje, že polovina znělého času byla uvnitř pásma."

[rule]
kind = "pitch_band"
min_share_pct = 50

[[sources]]
author = "L (u/Lsomethingsomething)"
title = "L's Voice Training Guide, level 4: mantra phrases"
url = "https://ourcast.neocities.org/4"

