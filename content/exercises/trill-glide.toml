id = "trill-glide"
version = 2
skill = "warm-up"
item = "glide"
intent = "drill"
seconds = 20
reps = 2
live = "none"
demo = "glide"
hints = ["glide_low_hz", "glide_high_hz", "glide_breaks"]

[titles]
en = "Lip trill glide"
cs = "Klouzání s rtovým trylkem"

[summaries]
en = "A warm-up: an easy “brrr” that slides from low to high and back."
cs = "Rozcvička: lehké „brrr“, které klouže zdola nahoru a zpět."

[steps]
en = [
  "Close your lips loosely and blow so that they flutter: “brrr”, like a horse or a child playing with a toy car. Add your voice to it.",
  "No luck with the trill? Hum into a drinking straw instead; it does the same job.",
  "Slide slowly from a low, comfortable note up to a high, comfortable one and back down. About five seconds each way.",
  "Do it twice in one take, with a breath between.",
]
cs = [
  "Volně sevřete rty a foukejte, až se rozechvějí: „brrr“, jako kůň nebo dítě s autíčkem. Přidejte k tomu hlas.",
  "Trylek nejde? Bzučte místo toho do brčka; udělá stejnou službu.",
  "Pomalu klouzejte od nízkého pohodlného tónu k vysokému pohodlnému a zpět. Asi pět sekund každým směrem.",
  "V jedné nahrávce to udělejte dvakrát, s nádechem mezi tím.",
]

[right]
en = "Quiet and almost effortless, like idling. The pitch moves smoothly, without a jump or a crack on the way. How high you get does not matter at all."
cs = "Tiché a skoro bez námahy, jako volnoběh. Výška se mění plynule, bez skoku a přeskočení. Jak vysoko se dostanete, je úplně jedno."

[mistakes]
en = [
  "The trill keeps stopping: more air, looser lips, or press a fingertip lightly into each cheek. Or use the straw.",
  "Pushing for the top: stop where it is still easy. The range grows by itself over weeks.",
  "A crack or a jump on the way: normal at first. Go slower and quieter through that spot.",
]
cs = [
  "Trylek se pořád zastavuje: víc vzduchu, volnější rty, nebo si lehce přitlačte prst do každé tváře. Nebo použijte brčko.",
  "Tlačení k vrcholu: přestaňte tam, kde je to ještě snadné. Rozsah během týdnů naroste sám.",
  "Přeskočení nebo skok po cestě: zpočátku běžné. Tím místem projděte pomaleji a tišeji.",
]

[why]
en = "It is a warm-up, not a test. With the mouth half closed the vocal folds vibrate with very little effort, which loosens the voice and smooths the join between your low and high voice. The app shows your range and counts jumps, for interest only."
cs = "Je to rozcvička, ne zkouška. S napůl zavřenými ústy hlasivky kmitají s velmi malou námahou, což hlas uvolní a uhladí přechod mezi nízkým a vysokým hlasem. Aplikace ukáže rozsah a spočítá skoky, jen pro zajímavost."

[safety]
en = "Stop if anything scratches, tickles into a cough or tightens in your throat."
cs = "Přestaňte, pokud cokoli škrábe, dráždí ke kašli nebo se v krku něco stahuje."

[rule]
kind = "none"

