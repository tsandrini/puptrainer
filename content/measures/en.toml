# Texts of the numbers a practice take is judged by (`puptrainer.core.evaluation`).

[band_share_pct]
title = "Time in your band"
description = "Share of the voiced time whose pitch lies inside your band."

[band_up_share_pct]
title = "Time in or above your band"
description = "Share of the voiced time whose pitch is not below your band's lower edge."

[note_offset_st]
title = "Away from the note"
description = "How far your voice was from the note on the whole, in semitones; minus is below."

[step_first_cm]
title = "Size of the first sound"
description = "Apparent vocal-tract length of the first held sound. Smaller is brighter; under half a centimetre is noise."

[step_last_cm]
title = "Size of the last sound"
description = "Apparent vocal-tract length of the last held sound."

[hold_s]
title = "Steady hold"
description = "The longest stretch held steadily inside the range (dropouts under 50 ms do not end it)."

[hold_pitch_hz]
title = "Held pitch"
description = "The median pitch of that steady stretch."

[hold_offset_cents]
title = "Off the note"
description = "How far the held pitch lies from the note, in cents (a hundredth of a semitone); minus is below."

[steps_found]
title = "Held sounds"
description = "How many held sounds were found (each at least 1.5 s, with a pause between)."

[step_rise_pct]
title = "Brightening"
description = "How much the formant spacing rose from the first held sound to the last: smaller and brighter is higher."

[step_drift_st]
title = "Pitch drift"
description = "How far apart the held sounds' pitches lie, in semitones."

# --- a take read against your own everyday voice (`puptrainer.core.reading`)

[pitch_shift_st]
title = "Pitch"
description = "How far the median pitch lies above your everyday voice, in semitones (twelve are an octave)."

[brightness_pct]
title = "Brightness"
description = "How much higher the resonances F2 to F4 sit than in your everyday voice. A shorter, smaller space above the vocal folds raises them all together. For scale: speaker by speaker, women's lie 10 to 23% above the average man's, 16% in the middle, and children's higher still (vowel tables of Hillenbrand and colleagues, 1995). About 4 to 6% is the smallest difference a listener can hear at all. Your everyday voice need not be the average man's, so read the zone as a neighbourhood, not a line; and how a voice is heard depends on pitch as well."

[brightness_pct.zones]
typical = "where women's voices sit"
beyond = "children's voices"

[r1_shift_pct]
title = "First resonance (R1)"
description = "How much higher the lowest resonance, F1, sits than in your everyday voice. A smaller throat raises it; a closed jaw, a quieter voice and sound through the nose lower it. For scale: women's F1 lies 8 to 29% above the average man's on the same vowel, 17% in the middle. In running speech it follows the jaw as much as the throat, so it says most on a held or whispered vowel."

[r1_shift_pct.zones]
typical = "where women's voices sit"
beyond = "children's voices"

[level_shift_db]
title = "Loudness"
description = "How much louder the take is than your everyday voice on the same microphone setup."

[clarity_shift_db]
title = "Clarity"
description = "How much clearer the tone is than in your everyday voice (CPPS). Breath, strain and a quieter voice all lower it."
