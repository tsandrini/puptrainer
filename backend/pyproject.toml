[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "puptrainer"
version = "0.1.0"
description = "Voice training companion: record, analyse and track voice practice"
requires-python = ">=3.12"
license = "EUPL-1.2"
dependencies = ["pydantic>=2.7", "pydantic-settings>=2.3"]

[project.optional-dependencies]
api = [
  "alembic>=1.13",
  "fastapi>=0.115",
  "numpy>=1.26",
  "python-multipart>=0.0.9",
  "soundfile>=0.12",
  "sqlalchemy>=2.0",
  "uvicorn>=0.30",
]
analysis = ["httpx>=0.27", "numpy>=1.26", "praat-parselmouth>=0.4.5", "soundfile>=0.12"]
dev = ["httpx>=0.27", "pytest>=8"]

[project.scripts]
puptrainer-api = "puptrainer.api.__main__:main"
puptrainer-worker = "puptrainer.analysis.worker:main"

[tool.hatch.build.targets.wheel]
packages = ["src/puptrainer"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["B", "D", "E", "F", "I", "N", "SIM", "UP"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]
"src/puptrainer/api/migrations/**" = ["D"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.pyright]
include = ["src", "tests"]
typeCheckingMode = "standard"
